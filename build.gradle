plugins {
    id 'java'
}

group = 'com'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(19)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // Tomcat Embedded
    // Use Tomcat 10.1.x with Jakarta EE 9
    implementation 'org.apache.tomcat.embed:tomcat-embed-core:10.1.16'
    implementation 'org.apache.tomcat.embed:tomcat-embed-jasper:10.1.16'
    implementation 'jakarta.servlet:jakarta.servlet-api:6.0.0'

    // Jakarta EE (Servlet/JSP)
    compileOnly 'jakarta.servlet:jakarta.servlet-api:6.0.0'
    compileOnly 'jakarta.servlet.jsp:jakarta.servlet.jsp-api:3.1.1'

    // JSTL (Jakarta)
    implementation 'jakarta.servlet.jsp.jstl:jakarta.servlet.jsp.jstl-api:3.0.0'
    implementation 'org.glassfish.web:jakarta.servlet.jsp.jstl:3.0.1'

    // Logging
    implementation 'org.slf4j:slf4j-api:2.0.9'             // SLF4J API
    implementation 'ch.qos.logback:logback-classic:1.4.11'  // Logback implementation
    implementation 'ch.qos.logback:logback-core:1.4.11'     // Logback core

    // Database
    implementation 'org.postgresql:postgresql:42.7.5'

    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.9.2'
    testImplementation 'org.junit.jupiter:junit-jupiter-engine:5.9.2'
    testImplementation 'org.junit.jupiter:junit-jupiter-params:5.9.2'
}

tasks.named('test') {
    useJUnitPlatform()
}
